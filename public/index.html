<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="stylesheet" href="./index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- <div id="root"></div> -->

    <div class="container-content">

      <div class="container-search">
        <a href="http://localhost:3000/" class="search-first-element">my.fm</a>
        <form class="search-second-element" action="search.html" method="GET">
          <input class="search-input" type="text" name="q" placeholder="Search..">
          <button class="search-button" type="submit">SUBMIT</button>
        </form>
      </div>

      <div class="container">

        <div class="section-name">Hot right now</div>

        <div class="flex-covers">
          <!-- Здесь будут обложки -->
        </div>
        
        <div class="grid-hot-artists">
          <!-- Исполнители будут загружаться сюда через JS -->
        </div>
    
        <div class="section-name">Popular tracks</div>
        <div id="tracks-container" class="grid-hot-tracks">
          <!-- Треки будут загружаться сюда через JS -->
        </div>

      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
